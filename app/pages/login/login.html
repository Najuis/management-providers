<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lagobo Distribuciones</title>
    <link rel="stylesheet" href="/pages/login/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Accede al panel de gestión de Management Providers. Inicio de sesión seguro.">
</head>
<body>
    <div class="login-container">
        <!-- ✅ LOGO INSTITUCIONAL -->
        <img src="/pages/assets/logo-lagobo.png" alt="Lagobo Distribuciones" class="institutional-logo">
        
        <div class="login-card">
            <div class="login-header">
                <h1>Bienvenido de nuevo</h1>
                <p>Ingresa tus credenciales para acceder</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="login-button" id="submitButton">
                    <span class="button-text">Iniciar Sesión</span>
                    <div class="loader-spinner" id="loader"></div>
                </button>
            </form>
        </div>
    </div>
    <script src="/pages/login/login.js"></script>
</body>
</html>
