<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Usuarios - LAGOBO</title>
    <link rel="stylesheet" href="/pages/admin/confirmation/confirmation.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="admin-header">
        <div class="header-inner">
            <div>
                <h1>Listado de Usuarios</h1>
                <p>Usuarios creados en el sistema de gestión de proveedores y terceros.</p>
            </div>
            <a href="/admin/menu" class="btn btn-back">← Volver al Menú</a>
        </div>
    </header>

    <main class="list-container">
        <section class="card">
            <div class="list-head">
                <h2>📋 Usuarios Creados</h2>
                <span class="count-badge" id="userCount">0</span>
            </div>
            <div class="user-list" id="userList">
                <p class="loading">Cargando usuarios...</p>
            </div>
        </section>
    </main>

    <script src="/pages/admin/confirmation/confirmation.js"></script>
</body>

</html>
