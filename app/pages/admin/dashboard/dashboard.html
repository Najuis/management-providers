<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrativo - LAGOBO</title>
    <link rel="stylesheet" href="/pages/admin/dashboard/dashboard.css">
</head>
<body>
    <div id="adminDashboard">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 15px;">
            <h1 class="section-title">
                <span class="number">⚙️</span>
                Menu de Administración
            </h1>
            <button onclick="logout()" class="btn btn-secondary">Cerrar Sesión</button>
        </header>

        <!-- ✅ SECCIÓN DE ACCIONES RÁPIDAS (NUEVO) -->
        <div class="quick-actions">
            <a href="/admin/validation" class="btn btn-validation">
                📋 Ir a Validación de Formularios
            </a>
            <a href="/admin/menu" class="btn btn-secondary">
                📊Panel Principal
            </a>
        </div>

        <!-- SECCIÓN CREAR USUARIO -->
        <div class="user-management">
            <h3>👤 Crear Nuevo Usuario</h3>
            <form id="createUserForm" class="form-grid">
                <div class="form-group">
                    <label>Correo Electrónico <span class="required">*</span></label>
                    <input type="email" id="newEmail" required placeholder="ejemplo@lagobo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña <span class="required">*</span></label>
                    <input type="password" id="newPassword" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label>Tipo de Usuario <span class="required">*</span></label>
                    <select id="newTypeUser" required>
                        <option value="2">Usuario Normal (Proveedor/Cliente)</option>
                        <option value="1">Administrador</option>
                    </select>
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <button type="submit" class="btn btn-success">Crear Usuario</button>
                </div>
            </form>
        </div>

        <!-- SECCIÓN LISTA DE USUARIOS -->
        <div id="userList" class="user-list">
            <h3>📋 Usuarios Creados</h3>
            <p style="color: #999; text-align: center; padding: 20px;">Cargando usuarios...</p>
        </div>

        <!-- SECCIÓN FORMULARIOS RECIBIDOS -->
        <div id="formsList" class="user-list" style="margin-top: 2.5rem;">
            <h3>📄 Formularios Recibidos</h3>
            <p style="color: #999; text-align: center; padding: 20px;">Cargando formularios...</p>
        </div>
    </div>

    <script src="/pages/admin/dashboard/dashboard.js"></script>
</body>
</html>
