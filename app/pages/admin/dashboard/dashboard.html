<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Management Providers</title>
    <link rel="stylesheet" href="/pages/admin/dashboard/dashboard.css">
</head>

<body>
    <div id="adminDashboard" class="section">
        <h2 class="section-title">
            <span class="number">👤</span>
            Panel de Administrador
        </h2>

        <!-- Crear Usuario -->
        <div class="user-management">
            <h3>➕ Crear Nuevo Usuario</h3>
            <form id="createUserForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Usuario <span class="required">*</span></label>
                        <input type="text" id="newUsername" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña <span class="required">*</span></label>
                        <input type="text" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="newEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Persona <span class="required">*</span></label>
                        <select id="newTipoPersona" required>
                            <option value="">Seleccione...</option>
                            <option value="natural">Persona Natural</option>
                            <option value="juridica">Persona Jurídica</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Vinculación <span class="required">*</span></label>
                        <select id="newTipoVinculacion" required>
                            <option value="">Seleccione...</option>
                            <option value="nuevo">Nuevo</option>
                            <option value="actualizacion">Actualización</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Servicio <span class="required">*</span></label>
                        <select id="newTipoServicio" required>
                            <option value="">Seleccione...</option>
                            <option value="institucional">Institucional</option>
                            <option value="mayoreo">Mayoreo</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Crear Usuario</button>
            </form>
        </div>

        <!-- Lista de Usuarios -->
        <div id="userList" class="user-list">
            <h3>📋 Usuarios Creados</h3>
        </div>

        <!-- Lista de Formularios -->
        <div id="formsList">
            <h3>📄 Formularios Recibidos</h3>
        </div>

        <div class="btn-group no-print">
            <button class="btn btn-secondary" onclick="logout()">🚪 Cerrar Sesión</button>
        </div>
    </div>
</body>

</html>
