<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador - Lagobo</title>
    <link rel="stylesheet" href="/pages/admin/dashboard/dashboard.css">
</head>
<body>
    <div id="adminDashboard" class="section">
        <h2 class="section-title">
            <span class="number">👤</span>
            Panel de Administrador
        </h2>

        <!-- Crear Usuario -->
        <div class="user-management">
            <h3> Crear Nuevo Usuario</h3>
            <form id="createUserForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="newEmail" required placeholder="usuario@ejemplo.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña <span class="required">*</span></label>
                        <input type="password" id="newPassword" required placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="form-group">
                        <label>Rol de Usuario <span class="required">*</span></label>
                        <select id="newTypeUser" required>
                            <option value="2">Usuario Normal (Proveedor)</option>
                            <option value="1">Administrador</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Crear Usuario</button>
            </form>
        </div>

        <!-- Lista de Usuarios -->
        <div id="userList" class="user-list">
            <h3>📋 Usuarios Creados</h3>
            <p style="color: #999; text-align: center; padding: 20px;">Cargando usuarios...</p>
        </div>

        <!-- Lista de Formularios -->
        <div id="formsList">
            <h3>📄 Formularios Recibidos</h3>
            <p style="color: #999; text-align: center; padding: 20px;">Cargando formularios...</p>
        </div>

        <div class="btn-group no-print">
            <button class="btn btn-secondary" onclick="logout()"> Cerrar Sesión</button>
        </div>
    </div>

    <script src="/pages/admin/dashboard/dashboard.js"></script>
</body>
</html>
